# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
#
# ---------------------------------------------------------------------------
# JWT signing secret
# ---------------------------------------------------------------------------
# Required, with no fallback: if PAYCORE_JWT_SECRET is not set the app
# refuses to start ("paycore.jwt.secret is not configured: set the
# PAYCORE_JWT_SECRET environment variable") instead of silently signing
# tokens with the development secret from application.properties. The
# development secret is also rejected under this profile. It must be at
# least 32 bytes; generate one with
#   openssl rand -base64 48
# and keep it in your secret manager, not in any file in this repository.
paycore.jwt.secret=${PAYCORE_JWT_SECRET}
#
# ---------------------------------------------------------------------------
# Running behind a reverse proxy / load balancer
# ---------------------------------------------------------------------------
# Without this, every request appears to come from the proxy's address, so
# all customers would share one per-IP BVN allowance and login sessions
# would record the proxy instead of the customer.
#
# NATIVE uses Tomcat's RemoteIpValve. It honours X-Forwarded-For and
# X-Forwarded-Proto ONLY when the direct peer is a trusted proxy; from
# anyone else the headers are ignored, so clients cannot spoof their IP.
# It walks X-Forwarded-For right to left, skipping trusted proxies, and uses
# the first untrusted address as the client, so a forged left-most entry
# is never picked.
server.forward-headers-strategy=native

# Which peers are trusted to set X-Forwarded-For. The defaults are:
#
#   internal-proxies: private ranges (10/8, 172.16/12, 192.168/16, 127/8,
#                     169.254/16, 100.64/10, ::1, fc00::/7, fe80::/10).
#                     Suits a load balancer inside a private network, as
#                     long as nothing else on that network can reach the
#                     app directly.
#   trusted-proxies:  none.
#
# Narrow or extend them per environment with environment variables (Java
# regexes matched against the peer's IP), without editing this file:
#
#   SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES=10\.0\.1\.\d{1,3}
#       only your load balancer's subnet (recommended)
#   SERVER_TOMCAT_REMOTEIP_TRUSTEDPROXIES=173\.245\.4[89]\.\d{1,3}|...
#       public proxies/CDNs in front of it, e.g. Cloudflare's published ranges
#   SERVER_TOMCAT_REMOTEIP_REMOTEIPHEADER=X-Real-IP
#       only if your proxy does not send X-Forwarded-For
#
# A proxy that appends the peer address to X-Forwarded-For (the standard
# behaviour of nginx $proxy_add_x_forwarded_for, AWS ALB, GCP LB) is safe:
# the right-most untrusted entry is the address the proxy itself saw, and
# anything the client wrote further left is ignored.
#
# What must hold: the app is reachable ONLY through the trusted proxies.
# If a client can connect directly from an address matching the patterns
# above, it can choose its own X-Forwarded-For.
