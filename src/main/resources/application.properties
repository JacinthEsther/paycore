spring.application.name=paycore

# Secrets never live in this file. Each one is read from an environment
# variable. For local development, put them in paycore-local.properties in
# the project root (git-ignored; copy paycore-local.properties.example).
# Real environment variables take precedence over that file.
spring.config.import=optional:file:./paycore-local.properties

spring.datasource.url=${PAYCORE_DB_URL:jdbc:postgresql://localhost:5432/paycore}
spring.datasource.username=${PAYCORE_DB_USERNAME:postgres}
spring.datasource.password=${PAYCORE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
# Keep database sessions to the service transaction, not the whole web
# request, so a connection is never held while a response is written.
spring.jpa.open-in-view=false

# Connection pool. Each app instance holds at most this many connections;
# (instances x pool size) must stay under the database's connection limit.
# Size it to the database, not to the traffic: more connections than the
# database has cores mostly adds contention. Requests that cannot get a
# connection within the timeout fail fast instead of piling up.
spring.datasource.hikari.maximum-pool-size=${PAYCORE_DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${PAYCORE_DB_CONNECTION_TIMEOUT_MS:5000}
spring.flyway.enabled=true
# Session lifetime (banking practice): signed out after 15 minutes without
# activity, and after 12 hours at most. The access token must stay well
# below the idle timeout, because refreshing it is what counts as activity.
paycore.security.session.expiration=12h
paycore.security.session.idle-timeout=15m
# JWT: override the secret via PAYCORE_JWT_SECRET outside local development.
paycore.jwt.secret=${PAYCORE_JWT_SECRET:local-dev-only-paycore-jwt-secret-change-me-0123456789}
paycore.jwt.access-token-expiration=5m
paycore.jwt.refresh-token-expiration=12h

# KYC provider: "dojah" (default; its free sandbox uses mock data) or
# "simulated" (in-process test records, no vendor account needed; demo only).
paycore.kyc.provider=${PAYCORE_KYC_PROVIDER:dojah}

# Dojah. Never commit real keys.
dojah.base-url=${DOJAH_BASE_URL:https://sandbox.dojah.io}
dojah.app-id=${DOJAH_APP_ID:}
dojah.secret-key=${DOJAH_SECRET_KEY:}

# BVN retry limit: at most N FAILED checks per rolling window (then HTTP 429).
paycore.kyc.bvn.max-failed-attempts=3
paycore.kyc.bvn.attempt-window=24h
# Per-IP limit: at most N BVN checks (any result) per network per window, across all customers.
paycore.kyc.bvn.ip-max-attempts=10
paycore.kyc.bvn.ip-attempt-window=1h

# KYC document uploads (PDF/PNG/JPEG). Files go to local disk in development;
# only metadata and the storage key are stored in PostgreSQL.
paycore.kyc.documents.storage-dir=${PAYCORE_KYC_DOCUMENT_DIR:data/kyc-documents}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Developer Preview: seeds a shared demo admin and publishes its sign-in
# details at GET /api/v1/demo so visitors can try the admin flow. Only for
# the public demo on sandbox data; never enable it with real customers.
paycore.demo.enabled=${PAYCORE_DEMO_ENABLED:false}
paycore.demo.admin-email=${PAYCORE_DEMO_ADMIN_EMAIL:admin@paycore.demo}
paycore.demo.admin-password=${PAYCORE_DEMO_ADMIN_PASSWORD:}

# Customer top-ups through a payment provider: "none" (default; only staff
# deposit) or "simulated" (confirms fake card payments at once, amounts
# ending in .99 are declined; demo only, the balances are not real money).
paycore.funding.provider=${PAYCORE_FUNDING_PROVIDER:none}
# Transfers to and from other banks: "none" (default; only transfers
# inside PayCore) or "simulated" (a pretend interbank rail connected to
# "Test Bank"; payments ending in .99 are rejected and reversed; demo only).
paycore.rails.provider=${PAYCORE_RAILS_PROVIDER:none}
# Signs inbound transfer notifications from the rail (HMAC-SHA256). Blank
# disables the webhook.
paycore.rails.webhook-secret=${PAYCORE_RAILS_WEBHOOK_SECRET:}
# The most the Test Bank simulator sends to one account in total.
paycore.rails.simulator-inbound-limit-per-account=${PAYCORE_TESTBANK_LIMIT_PER_ACCOUNT:1000000}
# The most provider top-ups may add to one account in total, in major units.
paycore.funding.max-total-per-account=${PAYCORE_FUNDING_MAX_TOTAL_PER_ACCOUNT:500000}

# Browser origins allowed to call the API (comma-separated), e.g. the
# Developer Preview UI: https://paycore-ui.example.com
paycore.cors.allowed-origins=${PAYCORE_CORS_ALLOWED_ORIGINS:}

# Accounts. Currencies customers can open accounts in (ISO 4217), and the
# 3-digit institution code behind the NUBAN check digit of every account
# number. Changing the code invalidates existing account numbers.
paycore.accounts.supported-currencies=NGN
paycore.accounts.institution-code=999

# Ledger. Statements cover whole calendar days in this time zone, so a
# transfer at 23:30 UTC appears on the next day's statement in Lagos.
paycore.ledger.statement-time-zone=${PAYCORE_STATEMENT_TIME_ZONE:Africa/Lagos}

# Email verification. Links point at the web app: {public-url}/verify-email?token=...
paycore.email-verification.public-url=${PAYCORE_PUBLIC_URL:http://localhost:5173}
paycore.mail.from=${PAYCORE_MAIL_FROM:PayCore <no-reply@paycore.local>}
# SMTP is off unless spring.mail.host is set (SPRING_MAIL_HOST); emails are
# then only logged. Locally, Mailpit: SPRING_MAIL_HOST=localhost and
# SPRING_MAIL_PORT=1025, inbox at http://localhost:8025.
# A mail outage must not mark the API itself unhealthy.
management.health.mail.enabled=false

# Sign in with Google: the client id of a "Web application" OAuth client
# (Google Cloud Console > APIs & Services > Credentials). Empty = off.
paycore.google.client-id=${PAYCORE_GOOGLE_CLIENT_ID:}
