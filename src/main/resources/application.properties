spring.application.name=paycore

spring.config.import=optional:file:./paycore-local.properties

spring.datasource.url=${PAYCORE_DB_URL:jdbc:postgresql://localhost:5432/paycore}
spring.datasource.username=${PAYCORE_DB_USERNAME:postgres}
spring.datasource.password=${PAYCORE_DB_PASSWORD}
spring.flyway.user=${PAYCORE_DB_MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${PAYCORE_DB_MIGRATION_PASSWORD:${spring.datasource.password}}
paycore.database.require-least-privilege=${PAYCORE_DB_REQUIRE_LEAST_PRIVILEGE:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=${PAYCORE_DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${PAYCORE_DB_CONNECTION_TIMEOUT_MS:5000}
spring.flyway.enabled=true
paycore.security.session.expiration=12h
paycore.security.session.idle-timeout=15m
paycore.jwt.secret=${PAYCORE_JWT_SECRET:local-dev-only-paycore-jwt-secret-change-me-0123456789}
paycore.jwt.access-token-expiration=5m
paycore.jwt.refresh-token-expiration=12h

paycore.kyc.provider=${PAYCORE_KYC_PROVIDER:dojah}

dojah.base-url=${DOJAH_BASE_URL:https://sandbox.dojah.io}
dojah.app-id=${DOJAH_APP_ID:}
dojah.secret-key=${DOJAH_SECRET_KEY:}

paycore.kyc.bvn.max-failed-attempts=3
paycore.kyc.bvn.attempt-window=24h
paycore.kyc.bvn.ip-max-attempts=10
paycore.kyc.bvn.ip-attempt-window=1h

paycore.kyc.documents.storage-dir=${PAYCORE_KYC_DOCUMENT_DIR:data/kyc-documents}
paycore.kyc.tier-upgrade.review-working-days=${PAYCORE_TIER_REVIEW_WORKING_DAYS:3}
paycore.kyc.tier-upgrade.auto-approve=${PAYCORE_TIER_AUTO_APPROVE:true}
paycore.kyc.tier-upgrade.check-interval=${PAYCORE_TIER_CHECK_INTERVAL:PT15M}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

paycore.demo.enabled=${PAYCORE_DEMO_ENABLED:false}
paycore.demo.admin-email=${PAYCORE_DEMO_ADMIN_EMAIL:admin@paycore.demo}
paycore.demo.admin-password=${PAYCORE_DEMO_ADMIN_PASSWORD:}

paycore.funding.provider=${PAYCORE_FUNDING_PROVIDER:none}
paycore.rails.provider=${PAYCORE_RAILS_PROVIDER:none}
paycore.bills.provider=${PAYCORE_BILLS_PROVIDER:none}
paycore.bills.vtpass.base-url=${VTPASS_BASE_URL:https://sandbox.vtpass.com/api}
paycore.bills.vtpass.api-key=${VTPASS_API_KEY:}
paycore.bills.vtpass.public-key=${VTPASS_PUBLIC_KEY:}
paycore.bills.vtpass.secret-key=${VTPASS_SECRET_KEY:}
paycore.rails.webhook-secret=${PAYCORE_RAILS_WEBHOOK_SECRET:}
paycore.rails.simulator-inbound-limit-per-account=${PAYCORE_TESTBANK_LIMIT_PER_ACCOUNT:1000000}
paycore.funding.max-total-per-account=${PAYCORE_FUNDING_MAX_TOTAL_PER_ACCOUNT:500000}

paycore.cors.allowed-origins=${PAYCORE_CORS_ALLOWED_ORIGINS:}

paycore.accounts.supported-currencies=NGN
paycore.accounts.institution-code=999

paycore.ledger.statement-time-zone=${PAYCORE_STATEMENT_TIME_ZONE:Africa/Lagos}

paycore.email-verification.public-url=${PAYCORE_PUBLIC_URL:http://localhost:5173}
paycore.mail.from=${PAYCORE_MAIL_FROM:PayCore <no-reply@paycore.local>}
management.health.mail.enabled=false

paycore.devices.cooling-off=24h
paycore.devices.cooling-off-limit=20000
paycore.pin.max-attempts=3
paycore.one-time-codes.time-to-live=10m
paycore.one-time-codes.max-attempts=5

paycore.limits.tier1.daily-send=50000
paycore.limits.tier1.max-balance=300000
paycore.limits.tier2.daily-send=200000
paycore.limits.tier2.max-balance=500000
paycore.limits.tier3.daily-send=5000000
paycore.limits.tier3.max-balance=

paycore.google.client-id=${PAYCORE_GOOGLE_CLIENT_ID:}

paycore.payments.recovery.enabled=${PAYCORE_PAYMENT_RECOVERY_ENABLED:true}
paycore.payments.recovery.interval=${PAYCORE_PAYMENT_RECOVERY_INTERVAL:PT30S}
paycore.payments.stale-after=2m
paycore.payments.first-check-after=30s
paycore.payments.max-backoff=30m
paycore.payments.max-checks=12
paycore.payments.not-found-grace=10m

paycore.reconciliation.scheduled-runs.enabled=${PAYCORE_RECONCILIATION_ENABLED:true}
paycore.reconciliation.schedule=${PAYCORE_RECONCILIATION_SCHEDULE:0 30 6 * * *}
